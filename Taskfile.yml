version: '3'

tasks:
  build:web:
    desc: Build the Astro web app
    dir: web
    cmds:
      - npm run build

  deploy:web:
    desc: Build and deploy the web app to Cloudflare Pages
    dir: web
    aliases:
      - deploy-web
    deps:
      - build:web
    cmds:
      - npx wrangler pages deploy dist --project-name "${CLOUDFLARE_PAGES_PROJECT:-montferrand}" --commit-dirty=true
